name: Sync upstream main

on:
  schedule:
    # Friday at 11:00 Asia/Shanghai.
    - cron: "0 3 * * 5"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: upstream-main-sync
  cancel-in-progress: false

jobs:
  sync-main:
    name: Merge Silent1566/webhtv main
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          # Workflow file updates require a PAT with workflow access.
          token: ${{ secrets.PAT_TOKEN || github.token }}

      - name: Fetch upstream main
        run: |
          git remote add upstream https://github.com/Silent1566/webhtv.git
          git fetch --no-tags upstream refs/heads/main:refs/remotes/upstream/main

      - name: Merge upstream main
        id: merge
        run: |
          if git merge-base --is-ancestor upstream/main HEAD; then
            echo "Upstream main is already merged."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if ! git merge --no-edit upstream/main; then
            echo "::error::Could not merge upstream main. Resolve the merge manually before syncing again."
            exit 1
          fi

          echo "updated=true" >> "$GITHUB_OUTPUT"

      - name: Push main
        if: steps.merge.outputs.updated == 'true'
        run: git push origin HEAD:refs/heads/main
